name: Scheduled E2E Regression

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode with verbose logging'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  CI: true

jobs:
  full-regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm run start &
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Wait for server
        run: sleep 20 && curl -f http://localhost:3000 || exit 1

      - name: Run full E2E suite
        run: npm run test:e2e
        env:
          E2E_TEST_TIMEOUT: 600000

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-e2e-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: full-regression
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "E2E tests failed. Check the workflow run for details."
          echo "Report: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
